name: Deploy Frontend UAT

on:
  push:
    branches: [ "uat" ]   # change to main if FE deploys from main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "🚀 UAT Frontend Deploy Started"

            cd /var/www/html/front   # 👈 adjust if needed

            # ---------- CONFIG ----------
            BRANCH="uat"
            ENV_BUCKET="uat-system-files"
            ENV_PREFIX="env/frontend"
            ENV_FILE=".env"
            PM2_APP="uat-front"

            # ---------- GIT RESET ----------
            echo "🧹 Resetting local git state..."
            git fetch origin
            git checkout -B $BRANCH origin/$BRANCH
            git clean -fdx

            # ---------- FETCH ENV ----------
            echo "🔐 Fetching environment file from S3..."
            aws s3 cp "s3://$ENV_BUCKET/$ENV_PREFIX/$ENV_FILE" "$ENV_FILE"

            if [ ! -s "$ENV_FILE" ]; then
              echo "❌ .env file missing or empty"
              exit 1
            fi

            # ---------- CLEAN BUILD ----------
            echo "🧹 Cleaning old build artifacts..."
            rm -rf .next node_modules/.cache

            # ---------- BUILD ----------
            echo "📦 Installing dependencies..."
            npm install --omit=dev

            echo "🏗️ Building Next.js (SSR)..."
            npm run build

            # ---------- PM2 ----------
            echo "♻️ Reloading PM2 app..."
            pm2 reload "$PM2_APP" || pm2 start npm --name "$PM2_APP" -- run start

            echo "✅ UAT Frontend Deploy Completed Successfully"
