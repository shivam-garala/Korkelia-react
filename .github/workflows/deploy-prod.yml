name: Deploy Frontend PROD

on:
  push:
    branches: [ "main" ]   # change to main if FE deploys from main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "🚀 PROD Frontend Deploy Started"

            cd /var/www/html/front   # 👈 adjust if needed

            # ---------- CONFIG ----------
            BRANCH="main"
            ENV_BUCKET="production-system-files-storage"
            ENV_PREFIX="env/frontend"
            ENV_FILE=".env.prod.frontend"
            PM2_APP="prod-front"

            # ---------- GIT RESET ----------
            echo "🧹 Resetting local git state..."
            git checkout .
            git fetch origin
            git checkout -B $BRANCH origin/$BRANCH
            git clean -fd

            # ---------- FETCH ENV ----------
            echo "🔐 Fetching environment file from S3..."
            aws s3 cp "s3://$ENV_BUCKET/$ENV_PREFIX/$ENV_FILE" "$ENV_FILE"

            if [ ! -s "$ENV_FILE" ]; then
              echo "❌ .env file missing or empty"
              exit 1
            fi

            # ---------- CLEAN BUILD ----------
            echo "🧹 Cleaning old build artifacts..."
            rm -rf .next node_modules/.cache

            # ---------- BUILD ----------
            echo "📦 Installing dependencies..."
            npm install --no-audit --no-fund

            echo "🏗️ Building Next.js (SSR)..."
            npm run build

            # ---------- PM2 ----------
            echo "♻️ Reloading PM2 app..."
            pm2 reload "$PM2_APP" || pm2 start npm --name "$PM2_APP" -- run start

            echo "✅ PROD Frontend Deploy Completed Successfully"
