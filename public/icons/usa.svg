<svg xmlns="http://www.w3.org/2000/svg" width="64" height="48" viewBox="0 0 60 40" role="img" aria-label="United States flag">
  <defs>
    <path id="star" d="M0-1.2 0.35-0.35 1.2-0.35 0.5 0.15 0.75 1.05 0 0.5 -0.75 1.05 -0.5 0.15 -1.2-0.35 -0.35-0.35Z" fill="#fff"/>
  </defs>
  <!-- field -->
  <rect width="60" height="40" fill="#b22234"/>
  <!-- white stripes -->
  <g fill="#fff">
    <rect y="3.08" width="60" height="3.08"/>
    <rect y="9.24" width="60" height="3.08"/>
    <rect y="15.4" width="60" height="3.08"/>
    <rect y="21.56" width="60" height="3.08"/>
    <rect y="27.72" width="60" height="3.08"/>
    <rect y="33.88" width="60" height="3.08"/>
  </g>
  <!-- canton -->
  <rect width="26" height="20" fill="#3c3b6e"/>
  <!-- stars -->
  <g transform="translate(3 3)">
    <!-- 9 staggered rows -->
    <g id="row6">
      <use href="#star" x="0" y="0"/>
      <use href="#star" x="4" y="0"/>
      <use href="#star" x="8" y="0"/>
      <use href="#star" x="12" y="0"/>
      <use href="#star" x="16" y="0"/>
    </g>
    <g id="row5">
      <use href="#star" x="2" y="2.2"/>
      <use href="#star" x="6" y="2.2"/>
      <use href="#star" x="10" y="2.2"/>
      <use href="#star" x="14" y="2.2"/>
      <use href="#star" x="18" y="2.2"/>
    </g>
    <use href="#row6" y="0"/>
    <use href="#row5" y="2.4"/>
    <use href="#row6" y="4.8"/>
    <use href="#row5" y="7.2"/>
    <use href="#row6" y="9.6"/>
    <use href="#row5" y="12"/>
    <use href="#row6" y="14.4"/>
    <use href="#row5" y="16.8"/>
  </g>
</svg>
